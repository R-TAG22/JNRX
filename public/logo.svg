<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042C21" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#021E16" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4F870" />
      <stop offset="50%" stop-color="#B7E84B" />
      <stop offset="100%" stop-color="#8BB825" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#B7E84B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="800" rx="140" fill="url(#bgGrad)" />
  <rect width="792" height="792" x="4" y="4" rx="136" fill="none" stroke="#B7E84B" stroke-width="2.5" stroke-opacity="0.25" />

  <!-- Inner Tech Ambient Grid Lines -->
  <g stroke="#B7E84B" stroke-width="1" stroke-opacity="0.08">
    <circle cx="400" cy="400" r="320" fill="none" stroke-dasharray="8 8" />
    <circle cx="400" cy="400" r="240" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- Central Stylized JNRX Monogram -->
  <g transform="translate(140, 160)">
    <!-- J Section -->
    <path d="M 60 50 L 120 50 L 120 250 C 120 310, 80 340, 20 340 C -10 340, -35 330, -50 315 L -25 265 C -15 275, 0 282, 18 282 C 45 282, 60 268, 60 240 Z" fill="url(#limeGrad)" filter="url(#glow)" />
    
    <!-- N Section -->
    <path d="M 155 340 L 155 70 L 210 70 L 290 240 L 290 70 L 345 70 L 345 340 L 290 340 L 210 170 L 210 340 Z" fill="url(#whiteGrad)" />
    
    <!-- R Section -->
    <path d="M 375 70 L 465 70 C 510 70, 535 95, 535 145 C 535 185, 510 210, 470 218 L 540 340 L 480 340 L 420 225 L 420 340 L 375 340 Z M 420 120 L 420 175 L 460 175 C 480 175, 490 165, 490 148 C 490 130, 480 120, 460 120 Z" fill="url(#limeGrad)" filter="url(#glow)" />
    
    <!-- X Section (Distinct overlapping dynamic blades) -->
    <path d="M 545 70 L 605 70 L 670 200 L 735 70 L 795 70 L 700 245 L 805 340 L 745 340 L 670 270 L 595 340 L 535 340 L 640 245 Z" fill="url(#whiteGrad)" />
  </g>

  <!-- Bottom Subtitle / Tagline Badge -->
  <g transform="translate(400, 620)">
    <rect x="-190" y="-24" width="380" height="48" rx="24" fill="#031F17" stroke="#B7E84B" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="0" y="7" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="900" fill="#B7E84B" letter-spacing="8" text-anchor="middle">PERFORMANCE DEV</text>
  </g>
</svg>
